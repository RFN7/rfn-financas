<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RFN Finanças</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23c9f24a'/%3E%3Ctext x='50' y='64' font-size='34' text-anchor='middle' fill='%2312200a' font-family='sans-serif' font-weight='bold'%3ERFN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b0a;--bd:#232823;--ink:#eef2ee;--mut:#8a938a;--a1:#c9f24a;--a2:#a7d63a;--aink:#12200a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(120% 80% at 50% -10%,#12200a,#0a0b0a 60%);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{max-width:380px;width:100%;text-align:center;animation:up .5s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.logo{width:92px;height:92px;border-radius:26px;margin:0 auto 20px;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;color:var(--aink);font-weight:800;font-size:28px;box-shadow:0 22px 50px -18px var(--a1)}
h1{font-size:25px;font-weight:800;letter-spacing:-.5px}
h1 span{color:var(--a1)}
.sub{color:var(--mut);font-size:12.5px;margin-top:6px}
.av{display:flex;justify-content:center;margin:16px 0}
.pic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;border:3px solid var(--bg)}
.pic.m{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--aink)}
.pic.f{background:linear-gradient(135deg,#EC4899,#a21caf);margin-left:-12px}
.motto{font-style:italic;opacity:.92;font-size:14px;line-height:1.5;margin:6px auto 22px;max-width:300px;border-left:2px solid var(--a1);padding-left:12px;text-align:left}
.btn{display:block;width:100%;background:var(--a1);color:var(--aink);border:0;border-radius:14px;padding:15px;font-size:15px;font-weight:800;cursor:pointer;text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn2{display:block;width:100%;background:transparent;color:var(--ink);border:1px solid var(--bd);border-radius:14px;padding:13px;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none;margin-top:10px}
.foot{color:var(--mut);opacity:.6;font-size:11px;margin-top:22px}
</style></head><body>
<div class="card">
  <div class="logo">RFN</div>
  <h1>RF<span>N</span> Finanças</h1>
  <div class="sub">Romero &amp; Fernanda · organização da casa</div>
  <div class="av"><div class="pic m">R</div><div class="pic f">F</div></div>
  <div class="motto">“Só o conhecimento tira o pobre da pobreza.”</div>
  <a class="btn" href="painel.html">Entrar no painel →</a>
  <a class="btn2" href="gasto.html">➕ Adicionar gasto rápido</a>
  <div class="foot">RFN Finanças · organização financeira da família</div>
</div>
</body></html>
