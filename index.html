<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Ganhos & Gastos</title>
<meta name="description" content="Caderninho simples de ganhos, gastos e parcelas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0A0B0E; --surface:#121419; --surface-2:#191C23; --border:#262B34;
  --ink:#F2F4F8; --muted:#8b93a1; --faint:#5a616e;
  --accent:#FF3B3B; --accent-glow:#ff3b3b55;
  --in:#25E39B; --in-soft:#25e39b1a; --out:#FF5A5A; --out-soft:#ff5a5a1a;
  --parc:#FFB020; --parc-soft:#ffb0201a;
  --radius:14px; color-scheme:dark;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F4F5F8; --surface:#FFFFFF; --surface-2:#F5F6F9; --border:#E3E6EC;
  --ink:#131620; --muted:#697084; --faint:#9aa1b0;
  --accent:#E11020; --accent-glow:#e1102033;
  --in:#0E9F6E; --in-soft:#0e9f6e12; --out:#E5323C; --out-soft:#e5323c10;
  --parc:#B97609; --parc-soft:#b976090f;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#F4F5F8; --surface:#FFFFFF; --surface-2:#F5F6F9; --border:#E3E6EC;
  --ink:#131620; --muted:#697084; --faint:#9aa1b0;
  --accent:#E11020; --accent-glow:#e1102033;
  --in:#0E9F6E; --in-soft:#0e9f6e12; --out:#E5323C; --out-soft:#e5323c10;
  --parc:#B97609; --parc-soft:#b976090f;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0A0B0E; --surface:#121419; --surface-2:#191C23; --border:#262B34;
  --ink:#F2F4F8; --muted:#8b93a1; --faint:#5a616e;
  --accent:#FF3B3B; --accent-glow:#ff3b3b55;
  --in:#25E39B; --in-soft:#25e39b1a; --out:#FF5A5A; --out-soft:#ff5a5a1a;
  --parc:#FFB020; --parc-soft:#ffb0201a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1{margin:0;font-size:18px;letter-spacing:-.3px;line-height:1.15}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select{font-family:inherit;font-size:15px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:600px;margin:0 auto;padding:20px 16px 90px}

.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#8a0f0f);display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px;box-shadow:0 0 16px var(--accent-glow);flex-shrink:0}
.top small{display:block;color:var(--muted);font-size:11px;letter-spacing:.4px;text-transform:uppercase}
.spacer{flex:1}
.iconbtn{background:var(--surface);border:1px solid var(--border);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-size:16px;flex-shrink:0}
.iconbtn:hover{border-color:var(--accent)}
.msel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 8px;color:var(--ink);font-weight:600;max-width:172px}

.tabbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.tabbar button{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px;font-weight:600;font-size:14px;color:var(--muted);transition:.12s}
.tabbar button.on{background:var(--accent-soft,#ff3b3b1a);color:var(--accent);border-color:transparent}
.tabbar button.on{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.footerbtn{width:100%;background:transparent;border:1px dashed var(--border);border-radius:10px;padding:10px;color:var(--faint);font-size:13px;margin-top:22px}
.footerbtn:hover{border-color:var(--out);color:var(--out)}
/* import */
.imp{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.imp h3{margin:0 0 4px;font-size:15px}
.imp p.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.imp textarea{width:100%;min-height:120px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:11px 12px;color:var(--ink);outline:0;font-family:inherit;font-size:14px;resize:vertical}
.imp textarea:focus{border-color:var(--accent)}
.drop{border:1.5px dashed var(--border);border-radius:12px;padding:22px 14px;text-align:center;color:var(--muted);font-size:13.5px;cursor:pointer;transition:.12s;background:var(--surface-2)}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--ink)}
.drop .big{font-size:26px;display:block;margin-bottom:6px}
.orsep{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px;margin:14px 0}
.orsep::before,.orsep::after{content:"";flex:1;height:1px;background:var(--border)}
.filechip{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:7px 11px;font-size:13px;margin-top:10px}
.filechip button{background:0;border:0;color:var(--muted);font-size:14px}
.status{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:14px 2px}
.spin{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.revrow{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 13px;margin-bottom:8px}
.revrow input[type=checkbox]{width:19px;height:19px;accent-color:var(--in);flex-shrink:0}
.revrow.off{opacity:.45}
.revrow .b{flex:1;min-width:0}
.revrow .d{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.revrow .m{color:var(--muted);font-size:12px;margin-top:1px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.revrow .tt{font-family:"JetBrains Mono",monospace;font-weight:600;white-space:nowrap;cursor:pointer;padding:2px 8px;border-radius:7px;border:1px solid var(--border)}
.revrow .tt.in{color:var(--in)} .revrow .tt.out{color:var(--out)}
/* sugestões */
.sug{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.sug .head{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.sug .head .ic{font-size:22px}
.sug .head b{font-size:15px}
.bigsave{font-size:30px;font-weight:700;font-family:"JetBrains Mono",monospace;letter-spacing:-1px}
.bigsave.pos{color:var(--in)} .bigsave.neg{color:var(--out)}
.bar{height:9px;border-radius:20px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:20px;background:var(--good)}
.tiprow{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.tiprow:first-of-type{border-top:0}
.tiprow .e{font-size:20px;flex-shrink:0;line-height:1.3}
.tiprow .c b{font-size:14px}
.tiprow .c p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.catbar{display:flex;align-items:center;gap:10px;padding:5px 0}
.catbar .nm{width:110px;flex-shrink:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catbar .tk{flex:1;height:16px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.catbar .tk>i{display:block;height:100%;background:var(--out);border-radius:6px}
.catbar .vv{width:92px;text-align:right;font-family:"JetBrains Mono",monospace;font-size:12.5px;font-weight:600}
.aiout{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:13px 15px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;margin-top:12px}
/* caixinhas */
.cx{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px;margin-bottom:11px}
.cx .top{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.cx .em{width:40px;height:40px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.cx .nm{flex:1;min-width:0}
.cx .nm b{font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx .nm small{color:var(--muted);font-size:12px}
.cx .pctbadge{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:13px;color:var(--in)}
.cx .vals{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:8px}
.cx .vals b{color:var(--ink);font-family:"JetBrains Mono",monospace}
.cx .acts{display:flex;gap:8px;margin-top:12px}
.cx .acts .dep{flex:1;background:var(--good-soft,#25e39b1a);color:var(--good);border:1px solid #25e39b55;border-radius:9px;padding:9px;font-weight:600;font-size:13px}
.cx .acts .mini{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:13px;color:var(--muted)}
.cx .acts .mini:hover{border-color:var(--accent);color:var(--accent)}
.cxsum{display:flex;align-items:center;gap:14px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:15px 17px;margin-bottom:14px}
.cxsum .big{font-size:26px;font-weight:700;font-family:"JetBrains Mono",monospace;color:var(--in);letter-spacing:-.5px}
.cxsum .t{flex:1}.cxsum .t b{font-size:14px}.cxsum .t p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
/* modo lista/categorias */
.modewrap{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;margin:4px 0 12px}
.modewrap button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px;border-radius:8px;font-weight:600;font-size:13.5px}
.modewrap button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px #0003}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.catcard{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px;cursor:pointer;transition:.1s}
.catcard:hover{border-color:var(--accent)}
.catcard .ce{font-size:22px;margin-bottom:8px}
.catcard .cn{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catcard .cv{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:18px;margin-top:4px;color:var(--out)}
.catcard.in .cv{color:var(--in)}
.catcard .cc{color:var(--muted);font-size:11.5px;margin-top:2px}
.parcalert{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 15px;margin-bottom:12px}
.parcalert .head{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.parcalert .head .ic{font-size:18px}.parcalert .head b{font-size:14px}
/* alerta / nudge */
.nudge{background:color-mix(in srgb,var(--accent) 11%,var(--surface));border:1px solid var(--accent);border-radius:16px;padding:15px 16px;margin-bottom:14px;box-shadow:0 0 22px var(--accent-glow)}
.nudge b{font-size:14.5px;color:var(--ink)}
.nudge p{margin:5px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.nudgebtn{margin-top:12px;background:var(--accent);color:#fff;border:0;border-radius:11px;padding:11px 16px;font-weight:600;font-size:14px;width:100%}
.nudgebtn:hover{box-shadow:0 0 16px var(--accent-glow)}
.rate{flex:1;border-radius:9px;padding:8px;font-size:12.5px;font-weight:600;color:var(--ink)}
.projcard{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.savetoast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--good);color:var(--good);font-size:12.5px;font-weight:600;padding:8px 15px;border-radius:20px;opacity:0;transition:opacity .2s;z-index:300;pointer-events:none;box-shadow:0 6px 20px -6px #0007}
.savetoast.show{opacity:1}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.scard .l{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.scard .v{font-size:22px;font-weight:600;font-family:"JetBrains Mono",monospace;letter-spacing:-.5px}
.scard.in .v{color:var(--in)} .scard.out .v{color:var(--out)}
.balance{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;background:var(--surface-2)}
.balance .v{font-size:26px}
.balance.pos .v{color:var(--in)} .balance.neg .v{color:var(--out)}
.balance small{color:var(--muted);font-size:12px;font-weight:400;font-family:"Space Grotesk"}
.parcstrip{display:flex;align-items:center;gap:10px;background:var(--parc-soft);border:1px solid #ffb02033;border-radius:12px;padding:10px 13px;margin-bottom:10px;font-size:13px}
.parcstrip .v{margin-left:auto;font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--parc)}

/* add form */
.add{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin:6px 0 4px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;margin-bottom:11px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px;border-radius:8px;font-weight:600;font-size:14px;transition:.12s}
.seg button.on.in{background:var(--in-soft);color:var(--in)}
.seg button.on.out{background:var(--out-soft);color:var(--out)}
.frm{display:flex;gap:9px;flex-wrap:wrap}
.frm input{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:11px 12px;color:var(--ink);outline:0}
.frm input:focus{border-color:var(--accent)}
.frm .desc{flex:1;min-width:150px}
.frm .amt{width:110px;font-family:"JetBrains Mono",monospace;font-weight:600}
.frm .parc{width:74px;font-family:"JetBrains Mono",monospace;text-align:center}
.frm .dt{width:150px}
.hint{color:var(--muted);font-size:12px;margin-top:9px;min-height:16px}
.hint b{color:var(--parc)}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:11px;cursor:pointer;user-select:none}
.chk input{width:17px;height:17px;accent-color:var(--accent)}
.badge.fx{background:var(--in-soft);color:var(--in)} .item.out .badge.fx{background:var(--out-soft);color:var(--out)}
.addbtn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:600;font-size:15px;transition:.15s;width:100%;margin-top:10px}
.addbtn:hover{box-shadow:0 0 16px var(--accent-glow)}

/* list */
.daygroup{margin-top:16px}
.daylabel{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding:0 4px 7px}
.daylabel .dtot{font-family:"JetBrains Mono",monospace}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:.1s}
.item:hover{border-color:var(--accent)}
.item .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px;flex-shrink:0}
.item.in .ic{background:var(--in-soft)} .item.out .ic{background:var(--out-soft)} .item.parc .ic{background:var(--parc-soft)}
.item .body{flex:1;min-width:0}
.item .desc{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{color:var(--muted);font-size:12px;margin-top:1px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .val{font-family:"JetBrains Mono",monospace;font-weight:600;font-size:15px;white-space:nowrap}
.itemdel{background:transparent;border:0;color:var(--faint);font-size:16px;padding:6px 2px 6px 10px;flex-shrink:0;line-height:1;cursor:pointer}
.itemdel:hover,.itemdel:active{color:var(--out)}
.itemdel.confirming{color:#fff;background:var(--out);border-radius:8px;font-size:12px;font-weight:700;padding:5px 9px}
.item.in .val{color:var(--in)} .item.out .val{color:var(--out)}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--parc-soft);color:var(--parc)}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
.exbanner{display:flex;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 13px;margin:14px 0;font-size:13px;color:var(--muted)}

/* modal */
.overlay{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);z-index:100;display:grid;place-items:end center;padding:0}
@media(min-width:560px){.overlay{place-items:center}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:18px;box-shadow:0 -10px 60px #000a;max-height:92vh;overflow-y:auto}
@media(min-width:560px){.modal{border-radius:18px}}
.modal h3{margin:0 0 14px;font-size:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:11px 12px;color:var(--ink);outline:0}
.field input:focus{border-color:var(--accent)}
.frow2{display:flex;gap:10px}.frow2 .field{flex:1}
.mrow{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;border:0;border-radius:10px;padding:12px;font-weight:600;font-size:15px}
.btn.save{background:var(--accent);color:#fff}
.btn.del{background:var(--out-soft);color:var(--out);border:1px solid var(--out)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--border)}
.seg.mini button{padding:9px}
.mhint{color:var(--muted);font-size:12px;margin:-4px 0 12px}.mhint b{color:var(--parc)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="top">
    <div class="logo">RFN</div>
    <div><h1>Ganhos &amp; Gastos</h1><small>Caderninho financeiro</small></div>
    <div class="spacer"></div>
    <select class="msel" id="msel"></select>
    <button class="iconbtn" id="theme">◐</button>
  </div>

  <div class="tabbar" id="tabbar"></div>
  <div id="mainView">
    <div id="nudge"></div>
    <div class="summary" id="summary"></div>
    <div id="parcinfo"></div>
    <div id="parclist"></div>
    <div class="add" id="addbox"></div>
    <div id="list"></div>
    <div id="footer"></div>
  </div>
  <div id="importView" style="display:none"></div>
  <div id="sugestoesView" style="display:none"></div>
  <div id="caixinhasView" style="display:none"></div>
</div>
<div id="modalRoot"></div>

<script>
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const fmt=n=>BRL.format(Math.round((n||0)*100)/100);
const fmts=n=>fmt(n).replace('R$','R$ ');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>String(s==null?'':s).replace(/"/g,'&quot;').replace(/</g,'&lt;');
// aceita vírgula (BR) e ponto: "35,50" / "1.234,56" / "35.50" / "1234"
function num(v){v=String(v==null?'':v).trim();if(!v)return NaN;if(v.indexOf(',')>-1)v=v.replace(/\./g,'').replace(',','.');return parseFloat(v);}
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

const monthKey=d=>{const s=String(d||'').slice(0,7);return /^\d{4}-\d{2}$/.test(s)?s:todayISO.slice(0,7);};
const monthLabel=k=>{const[y,m]=k.split('-');return MES[+m-1]+' '+y;};
function monthAdd(k,n){let[y,m]=String(k||'').slice(0,7).split('-').map(Number);if(!y||!m){[y,m]=todayISO.slice(0,7).split('-').map(Number);}m+=(+n||0);while(m<1){m+=12;y--;}while(m>12){m-=12;y++;}return `${y}-${String(m).padStart(2,'0')}`;}
function monthsDiff(a,b){const[ya,ma]=a.split('-').map(Number),[yb,mb]=b.split('-').map(Number);return(yb-ya)*12+(mb-ma);}

function makeSupaDb(){
  const base=SB_URL+'/rest/v1/ledger';
  const H={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
  function docRef(){
    return {
      async get(){
        try{
          const r=await fetch(base+'?id=eq.'+encodeURIComponent(SB_ROW)+'&select=data,updated_at',{headers:H});
          if(!r.ok)return {exists:false,data:()=>({})};
          const rows=await r.json();
          if(!rows.length)return {exists:false,data:()=>({})};
          const d=rows[0].data||{}; if(rows[0].updated_at!=null)d.updatedAt=rows[0].updated_at;
          return {exists:true,data:()=>d};
        }catch(e){return {exists:false,data:()=>({})};}
      },
      async set(obj){
        const body=[{id:SB_ROW,data:obj,updated_at:obj.updatedAt||Date.now()}];
        const r=await fetch(base,{method:'POST',headers:{...H,'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(body)});
        if(!r.ok)throw new Error('supabase '+r.status);
      },
      onSnapshot(next,err){
        let stop=false;
        const tick=async()=>{ if(stop)return;
          try{ const s=await docRef().get(); if(s.exists)next(s); }catch(e){ if(err)err(e); }
          if(!stop)setTimeout(tick,4000);
        };
        setTimeout(tick,4000);
        return ()=>{stop=true;};
      }
    };
  }
  return { doc(){ return docRef(); } };
}

async function flushDb(){
  if(__saving||!__dirty)return;
  if(!db){setSaveUI('local');return;} // sem banco ainda — será enviado quando conectar
  __saving=true;
  try{
    while(__dirty){__dirty=false;const payload=JSON.parse(JSON.stringify(state));await db.doc('ledger/data').set(payload);}
    setSaveUI('saved');
  }catch(e){__dirty=true;setSaveUI('retry');__saving=false;setTimeout(flushDb,2500);return;}

}
function normalize(){
  if(!state)return;
  if(!state.theme)state.theme='dark';
  if(!Array.isArray(state.boxes))state.boxes=[];
  // saneia cada lançamento para nunca quebrar a tela (data válida, valor numérico, tipo/parcela ok)
  state.entries=(Array.isArray(state.entries)?state.entries:[]).filter(e=>e&&typeof e==='object').map(e=>{
    let d=String(e.date||'');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ d=/^\d{4}-\d{2}/.test(d)?d.slice(0,7)+'-01':todayISO; }
    const o={...e, id:e.id||uid(), date:d, desc:String(e.desc==null?'':e.desc), amount:(+e.amount||0), parc:Math.max(1,parseInt(e.parc)||1), type:e.type==='in'?'in':'out'};
    if(e.cat!=null&&String(e.cat).trim())o.cat=String(e.cat); else delete o.cat;
    if(o.recur)o.recur=true; else delete o.recur;
    return o;
  });
  state.boxes=state.boxes.filter(b=>b&&typeof b==='object').map(b=>({...b,id:b.id||uid(),saved:(+b.saved||0),target:(+b.target||0),name:String(b.name||'Caixinha')}));
}

function parcCount(e){return Math.max(1,+e.parc||1);}
function parcValue(e){return (+e.amount||0)/parcCount(e);}
function parcEnd(e){return monthAdd(monthKey(e.date),parcCount(e)-1);}
/* itens que aparecem num mês (parcelas se estendem; somem após a última) */
function expandMonth(k){
  const out=[];
  state.entries.forEach(e=>{
    const fm=monthKey(e.date);
    if(e.recur){ if(k>=fm) out.push({e,idx:1,count:1,value:+e.amount||0,date:k+'-'+e.date.slice(8),recur:true}); return; }
    const pc=parcCount(e);
    if(pc>1){ const idx=monthsDiff(fm,k)+1; if(idx>=1&&idx<=pc) out.push({e,idx,count:pc,value:parcValue(e),date:k+'-'+e.date.slice(8),parcela:true}); }
    else if(fm===k) out.push({e,idx:1,count:1,value:+e.amount||0,date:e.date,parcela:false});
  });
  return out;
}
function months(){
  const s=new Set();
  state.entries.forEach(e=>{const fm=monthKey(e.date);
    if(e.recur){ let m=fm; let guard=0; while(m<=realMonth&&guard++<600){s.add(m);m=monthAdd(m,1);} s.add(fm); }
    else {const pc=parcCount(e);for(let i=0;i<pc;i++)s.add(monthAdd(fm,i));}
  });
  s.add(curMonth);s.add(realMonth);
  return[...s].sort();
}
function faltaParcelas(){ let s=0; state.entries.forEach(e=>{ if(e.recur||e.type!=='out'||parcCount(e)<=1)return; const fm=monthKey(e.date); for(let i=0;i<parcCount(e);i++){ if(monthAdd(fm,i)>=realMonth) s+=parcValue(e);} }); return s; }
function fixosMensais(){ let i=0,o=0; state.entries.forEach(e=>{ if(!e.recur)return; if(e.type==='in')i+=+e.amount||0; else o+=+e.amount||0; }); return {inc:i,out:o,has:(i>0||o>0)}; }
function hasExample(){return state.entries.some(e=>e.ex);}

function withTimeout(promise,ms,fallback){return Promise.race([Promise.resolve(promise).catch(()=>fallback),new Promise(r=>setTimeout(()=>r(fallback),ms))]);}
function downscaleImage(file,maxDim=1500,q=0.8){return new Promise(resolve=>{let done=false;const fin=v=>{if(!done){done=true;resolve(v);}};try{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{try{let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;const s=Math.min(1,maxDim/Math.max(w,h||1));const cw=Math.max(1,Math.round(w*s)),ch=Math.max(1,Math.round(h*s));const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;cv.getContext('2d').drawImage(img,0,0,cw,ch);cv.toBlob(b=>{URL.revokeObjectURL(url);fin(b||file);},'image/jpeg',q);}catch(e){URL.revokeObjectURL(url);fin(file);}};img.onerror=()=>{URL.revokeObjectURL(url);fin(file);};img.src=url;}catch(e){fin(file);}});}
function impSpin(msg,ctrl){const s=$('#imp-status');s.innerHTML='<div class="status"><span class="spin"></span> <span style="flex:1">'+msg+'</span></div>';if(ctrl){const c=el('button','btn ghost','Cancelar');c.style.cssText='margin-left:8px;padding:6px 12px;font-size:13px;flex:0 0 auto';c.onclick=()=>{try{ctrl.abort();}catch(e){}};s.querySelector('.status').appendChild(c);}}
async function analyze(){
  const text=($('#imp-text').value||'').trim();
  const status=$('#imp-status');$('#imp-review').innerHTML='';impItems=null;
  if(!impFiles.length&&!text){status.innerHTML='<div class="status">Cole um texto ou anexe pelo menos um arquivo. 👆</div>';return;}
  const sample=window.claude&&window.claude.use?await window.claude.use('sample').catch(()=>null):null;
  if(!sample){status.innerHTML='<div class="status">⚠️ A análise por IA não está disponível aqui. Você ainda pode lançar manualmente na aba Lançamentos.</div>';return;}
  const ctrl=new AbortController();
  const MAXI=12;
  impSpin('Preparando os arquivos…',ctrl);
  try{
    const lim=await sample.limits().catch(()=>null);
    const canImg=!!(lim&&lim.images);
    const maxImg=canImg?Math.max(1,lim.images.maxCount||1):0;
    // separa imagens e textos de todos os arquivos anexados (reduzindo o tamanho das fotos)
    const accepted=(lim&&lim.images&&lim.images.mediaTypes)||['image/jpeg','image/png','image/webp','image/gif'];
    const isImg=(f)=>(f.type||'').startsWith('image/')||/\.(jpe?g|png|webp|gif|heic|heif|bmp)$/i.test(f.name||'');
    let imgBlobs=[], textChunks=[], skipped=[], imgUnsupported=false; if(text)textChunks.push(text);
    for(let fx=0; fx<impFiles.length; fx++){
      if(ctrl.signal.aborted)throw{code:'cancelled'};
      const f=impFiles[fx], type=f.type||'';
      if(impFiles.length>1)impSpin('Lendo arquivo '+(fx+1)+' de '+impFiles.length+'…',ctrl);
      if(isImg(f)){
        if(!canImg){imgUnsupported=true;continue;}
        let blob=f;
        // já é JPEG/PNG pequeno? envia direto (a IA já reduz sozinha). Senão, converte/reduz.
        if(!accepted.includes(type)||f.size>5*1024*1024){ blob=await withTimeout(downscaleImage(f),15000,f); }
        if(accepted.includes(blob.type)) imgBlobs.push(blob); else skipped.push(f.name);
      } else if(type==='application/pdf'||/\.pdf$/i.test(f.name||'')){
        if(canImg){ const bs=await withTimeout(pdfToImages(f,3),25000,null); if(bs&&bs.length)imgBlobs.push(...bs); else { const t=await withTimeout(extractPdfText(f),20000,''); if(t)textChunks.push(t); } }
        else { const t=await withTimeout(extractPdfText(f),20000,''); if(t)textChunks.push(t); }
      } else { const t=await f.text().catch(()=>''); if(t)textChunks.push(t); }
    }
    let capped=0;
    if(imgBlobs.length>MAXI){ capped=imgBlobs.length-MAXI; imgBlobs=imgBlobs.slice(0,MAXI); }
    const realText=textChunks.some(t=>t&&!/^\[/.test(t));
    if(imgUnsupported&&!imgBlobs.length&&!realText){ status.innerHTML='<div class="status">⚠️ Este app não conseguiu enviar as imagens para a IA. Tente: (1) tirar um <b>print</b> da fatura em vez da foto, (2) colar o <b>texto</b> da fatura no campo acima, ou (3) importar pelo <b>computador</b> (claude.ai).</div>';return; }
    if(!imgBlobs.length&&skipped.length&&!realText){ status.innerHTML='<div class="status">⚠️ As imagens estão num formato que a IA não lê (ex.: <b>HEIC</b> do iPhone). Nas Configurações do iPhone → Câmera → Formatos, escolha "Mais Compatível", ou tire um <b>print</b> da fatura (que vira PNG) e anexe de novo.</div>';return; }
    const anoRef=curMonth.slice(0,4);
    const baseRules='"out"=gasto/compra/pagamento, "in"=recebimento/crédito/salário/estorno. amount sempre POSITIVO com ponto decimal (ignore R$; 1.234,56 vira 1234.56). Se a data tiver só dia/mês use o ano '+anoRef+'. cat=categoria curta (Mercado, Alimentação, Transporte, Combustível, Farmácia, Saúde, Vestuário, Lazer, Assinatura, Casa, Educação, Pets, Compras, Outros). Se a compra for PARCELADA, preencha "parc" com "atual/total" (ex.: "02/04") e coloque em amount o valor DA PARCELA daquele mês (NÃO o total); se não for parcelada use "parc":"". NÃO invente; se não houver lançamentos devolva {"itens":[]}.';
    const fmtItens=(arr)=>arr.filter(y=>y&&+y.amount>0).map(y=>{const pm=String(y.parc||y.parcela||'').match(/(\d{1,2})\s*\/\s*(\d{1,2})/)||String(y.desc||'').match(/(\d{1,2})\s*\/\s*(\d{1,2})/);return {date:(y.date&&/^\d{4}-\d{2}-\d{2}$/.test(y.date))?y.date:(curMonth+'-15'),desc:String(y.desc||''),amount:Math.round(Math.abs(+y.amount||0)*100)/100,type:(y.type==='in'?'in':'out'),cat:y.cat?String(y.cat).slice(0,20):'',parcNum:pm?+pm[1]:0,parcTotal:(pm&&+pm[2]>1)?+pm[2]:1};});
    const combinedText=textChunks.join('\n---\n').slice(0,7000);
    let all=[];
    if(imgBlobs.length){
      const batches=[]; for(let i=0;i<imgBlobs.length;i+=maxImg)batches.push(imgBlobs.slice(i,i+maxImg));
      for(let bi=0;bi<batches.length;bi++){
        if(ctrl.signal.aborted)throw{code:'cancelled'};
        impSpin('Analisando '+(batches.length>1?('parte '+(bi+1)+' de '+batches.length):'os anexos')+'… (pode levar até ~1 min)',ctrl);
        const prompt='Você é um assistente financeiro brasileiro. Extraia TODOS os lançamentos das imagens em anexo (fotos/páginas de faturas ou extratos)'+(bi===0&&combinedText?' e também deste texto:\n"""'+combinedText+'"""':'')+' e responda SOMENTE com JSON no formato:\n{"itens":[{"date":"AAAA-MM-DD","desc":"estabelecimento curto","amount":123.45,"type":"out","cat":"Mercado","parc":""}]}\nRegras: '+baseRules;
        const data=await sample.json(prompt,{modelTier:'default',images:batches[bi],signal:ctrl.signal});
        all=all.concat(fmtItens((data&&(data.itens||data.items))||[]));
      }
    } else {
      if(!combinedText){status.innerHTML='<div class="status">⚠️ Não consegui ler os arquivos. Cole o texto ou anexe um print.</div>';return;}
      impSpin('Analisando…',ctrl);
      const prompt='Você é um assistente financeiro brasileiro. Extraia TODOS os lançamentos do texto abaixo e responda SOMENTE com JSON no formato:\n{"itens":[{"date":"AAAA-MM-DD","desc":"estabelecimento curto","amount":123.45,"type":"out","cat":"Mercado","parc":""}]}\nRegras: '+baseRules+'\n\nTexto:\n"""'+combinedText+'"""';
      const data=await sample.json(prompt,{modelTier:'default',signal:ctrl.signal});
      all=fmtItens((data&&(data.itens||data.items))||[]);
    }
    const warns=[];
    if(capped>0)warns.push('anexou muitas imagens — analisei as primeiras '+MAXI+' (repita com o restante depois)');
    if(skipped.length)warns.push(skipped.length+' imagem(ns) em formato não suportado (ex.: HEIC do iPhone) foram ignoradas — envie como print/JPEG');
    lastImportWarn=warns.join('. ');
    if(!all.length){status.innerHTML='<div class="status">Não encontrei lançamentos. Tente imagens mais nítidas ou colar o texto.</div>';impItems=null;return;}
    // === adiciona de forma ACUMULATIVA: identifica o que já existe e só acrescenta o novo ===
    const norm=(s)=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');
    const cleanDesc=(s)=>String(s||'').replace(/\(?\s*parc\.?\s*\d{1,2}\s*\/\s*\d{1,2}\s*\)?/ig,'').replace(/\b\d{1,2}\s*\/\s*\d{1,2}\b/g,' ').replace(/\s+/g,' ').trim().slice(0,60);
    let added=[], dupCount=0, instCount=0; const jmc={};
    for(const it of all){
      const fatMonth=monthKey(it.date), day=(it.date.slice(8)||'10');
      if(it.parcTotal>1){
        const first=monthAdd(fatMonth,-(Math.max(1,it.parcNum)-1));
        const total=Math.round(it.amount*it.parcTotal*100)/100;
        const desc=cleanDesc(it.desc)||'Parcelamento';
        const dup=state.entries.some(e=>parcCount(e)>1&&!e.recur&&norm(e.desc)===norm(desc)&&parcCount(e)===it.parcTotal&&Math.abs(parcValue(e)-it.amount)<0.03)
          || added.some(a=>a.parc>1&&norm(a.desc)===norm(desc)&&a.parc===it.parcTotal&&Math.abs(a.amount/a.parc-it.amount)<0.03);
        if(dup){dupCount++;continue;}
        const o={id:uid(),type:it.type,desc,amount:total,date:first+'-'+day,parc:it.parcTotal};if(it.cat)o.cat=it.cat;
        added.push(o);instCount++;jmc[fatMonth]=(jmc[fatMonth]||0)+1;
      } else {
        const desc=cleanDesc(it.desc)||(it.type==='in'?'Ganho':'Gasto');
        const dup=state.entries.some(e=>parcCount(e)===1&&!e.recur&&e.date===it.date&&e.type===it.type&&Math.abs((+e.amount||0)-it.amount)<0.01&&norm(e.desc)===norm(desc))
          || added.some(a=>a.parc===1&&a.date===it.date&&a.type===it.type&&Math.abs(a.amount-it.amount)<0.01&&norm(a.desc)===norm(desc));
        if(dup){dupCount++;continue;}
        const o={id:uid(),type:it.type,desc,amount:it.amount,date:it.date,parc:1};if(it.cat)o.cat=it.cat;
        added.push(o);jmc[fatMonth]=(jmc[fatMonth]||0)+1;
      }
    }
    lastImportDup=dupCount; lastImportInst=instCount;
    if(!added.length){ status.innerHTML='<div class="status">✅ '+(dupCount>0?('Tudo desta fatura já estava lançado ('+dupCount+' itens) — nada novo a acrescentar.'):'Não encontrei lançamentos novos.')+'</div>'; impItems=null; return; }
    added.forEach(o=>state.entries.push(o));
    lastImportIds=added.map(o=>o.id);
    lastImportMonth=Object.keys(jmc).sort((a,b)=>jmc[b]-jmc[a])[0]||curMonth;
    curMonth=lastImportMonth;
    persist();
    status.innerHTML='';impItems=null;
    showImportResult(added);
  }catch(err){
    const code=(err&&err.code)||'';
    if(code==='cancelled'){status.innerHTML='<div class="status">Análise cancelada.</div>';return;}
    const msg={not_granted:'Você precisa permitir o uso da IA para analisar.',rate_limited:'Muitas análises seguidas — espere um minuto e tente com menos arquivos.',invalid_json:'A IA não estruturou os dados. Tente com menos imagens por vez.',image_rejected:'Uma das imagens é inválida ou grande demais. Remova-a e tente de novo.',prompt_too_large:'Conteúdo grande demais — envie menos arquivos por vez.',refused:'A IA não pôde processar este conteúdo.'}[code]||'Não deu para analisar agora. Tente com menos arquivos por vez.';
    status.innerHTML='<div class="status">⚠️ '+msg+'</div>';
  }
}

let pdfLibP=null;
function loadPdf(){ if(pdfLibP)return pdfLibP; pdfLibP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib);}catch(e){rej(e);}};s.onerror=rej;document.head.appendChild(s);}); return pdfLibP; }
async function extractPdfText(file){ const lib=await loadPdf(); const buf=await file.arrayBuffer(); const pdf=await lib.getDocument({data:buf}).promise; let txt=''; const n=Math.min(pdf.numPages,10); for(let p=1;p<=n;p++){const page=await pdf.getPage(p);const c=await page.getTextContent();txt+=c.items.map(i=>i.str).join(' ')+'\n';} return txt.trim(); }
async function pdfToImages(file,max){ const lib=await loadPdf(); const buf=await file.arrayBuffer(); const pdf=await lib.getDocument({data:buf}).promise; const n=Math.min(pdf.numPages,max||1); const out=[]; for(let p=1;p<=n;p++){ const page=await pdf.getPage(p); const vp=page.getViewport({scale:2}); const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height; await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise; const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85)); if(blob)out.push(blob);} return out; }

    card.innerHTML=`<div class="top"><div class="em">${bx.emoji||'🐷'}</div><div class="nm"><b>${esc(bx.name)}</b><small>${target>0?'meta '+fmt(target):'sem meta'}</small></div>${target>0?'<span class="pctbadge">'+pct.toFixed(0)+'%</span>':''}</div>`
      +(target>0?`<div class="bar"><i style="width:${pct}%"></i></div>`:'')
      +`<div class="vals"><span>Guardado <b>${fmt(saved)}</b></span>${target>0?'<span>Falta <b>'+fmt(Math.max(0,target-saved))+'</b></span>':''}</div>`
      +`<div class="acts"><button class="dep" data-dep="${bx.id}">＋ Guardar</button><button class="mini" data-ed="${bx.id}">✎</button><button class="mini" data-del="${bx.id}">🗑</button></div>`;
    v.appendChild(card);
  });
  v.querySelectorAll('[data-dep]').forEach(b=>b.onclick=()=>depositModal(b.dataset.dep));
  v.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>boxModal(b.dataset.ed));
  v.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>askConfirm('Apagar esta caixinha?',()=>{state.boxes=state.boxes.filter(x=>x.id!==b.dataset.del);persist();renderCaixinhas();}));
}
function boxModal(id){
  const bx=id?state.boxes.find(x=>x.id===id):{name:'',emoji:'🐷',target:'',saved:0};
  const emojis=['🐷','✈️','🏠','🚗','🎓','👶','🏥','🎁','💍','🎮','💻','💰'];
  const root=$('#modalRoot');const ov=el('div','overlay');const md=el('div','modal');
  md.innerHTML=`<h3>${id?'Editar caixinha':'Nova caixinha'}</h3>
    <div class="field"><label>Nome</label><input id="cx-name" value="${esc(bx.name)}" placeholder="Ex: Viagem, Poupança do Noah"></div>
    <div class="field"><label>Ícone</label><div id="cx-emojis" style="display:flex;flex-wrap:wrap;gap:6px"></div></div>
    <div class="frow2"><div class="field"><label>Meta (R$) — opcional</label><input id="cx-target" type="text" inputmode="decimal" value="${bx.target||''}" placeholder="0,00"></div>
    <div class="field"><label>Já guardado (R$)</label><input id="cx-saved" type="text" inputmode="decimal" value="${bx.saved||0}"></div></div>
    <div class="mrow"><button class="btn save" id="cx-save">${id?'Salvar':'Criar caixinha'}</button><button class="btn ghost" id="cx-cancel">Cancelar</button></div>`;
  ov.appendChild(md);root.innerHTML='';root.appendChild(ov);
  let emoji=bx.emoji||'🐷';const ewrap=md.querySelector('#cx-emojis');
  const drawE=()=>{ewrap.innerHTML='';emojis.forEach(e=>{const bb=el('button',null,e);bb.style.cssText='font-size:20px;width:40px;height:40px;border-radius:9px;background:'+(e===emoji?'var(--surface-2)':'transparent')+';border:1px solid '+(e===emoji?'var(--accent)':'var(--border)');bb.onclick=()=>{emoji=e;drawE();};ewrap.appendChild(bb);});};
  drawE();
  ov.onclick=e=>{if(e.target===ov)root.innerHTML='';};
  md.querySelector('#cx-cancel').onclick=()=>root.innerHTML='';
  md.querySelector('#cx-save').onclick=()=>{const name=md.querySelector('#cx-name').value.trim();if(!name){md.querySelector('#cx-name').focus();return;}
    const obj={name,emoji,target:num(md.querySelector('#cx-target').value)||0,saved:num(md.querySelector('#cx-saved').value)||0};
    if(id)Object.assign(state.boxes.find(x=>x.id===id),obj);else state.boxes.push({id:uid(),...obj});
    persist();root.innerHTML='';renderCaixinhas();};
}
function depositModal(id){
  const bx=state.boxes.find(x=>x.id===id);if(!bx)return;
  const root=$('#modalRoot');const ov=el('div','overlay');const md=el('div','modal');
  md.innerHTML=`<h3>${bx.emoji||'🐷'} ${esc(bx.name)}</h3>
    <p style="color:var(--muted);font-size:13px;margin:0 0 12px">Guardado hoje: <b class="mono" style="color:var(--ink)">${fmt(+bx.saved||0)}</b></p>
    <div class="field"><label>Valor (R$)</label><input id="dp-amt" type="text" inputmode="decimal" placeholder="0,00"></div>
    <div class="mrow"><button class="btn save" id="dp-add" style="background:var(--good)">＋ Guardar</button><button class="btn del" id="dp-sub">− Retirar</button></div>
    <div class="mrow"><button class="btn ghost" id="dp-cancel">Cancelar</button></div>`;
  ov.appendChild(md);root.innerHTML='';root.appendChild(ov);
  ov.onclick=e=>{if(e.target===ov)root.innerHTML='';};
  md.querySelector('#dp-cancel').onclick=()=>root.innerHTML='';
  const go=(sign)=>{const amt=num(md.querySelector('#dp-amt').value);if(!amt||amt<=0){md.querySelector('#dp-amt').focus();return;}bx.saved=Math.max(0,(+bx.saved||0)+sign*amt);if(sign>0)state.lastDepositDate=todayISO;persist();root.innerHTML='';renderCaixinhas();};
  md.querySelector('#dp-add').onclick=()=>go(1);
  md.querySelector('#dp-sub').onclick=()=>go(-1);
}

/* boot */
state=loadLocal()||seed();
normalize();
applyTheme();
if(months().indexOf(curMonth)<0)curMonth=months()[months().length-1];
renderTabs();render();saveLocal();

(async()=>{try{
  db=makeSupaDb();if(!db)return;
  const ref=db.doc('ledger/data');
  const snap=await ref.get();
  const adopt=(data)=>{state=data;normalize();applyTheme();if(months().indexOf(curMonth)<0)curMonth=months()[months().length-1];renderTabs();render();saveLocal();};
  if(snap.exists){
    const data=snap.data()||{};
    const serverHas=Array.isArray(data.entries)&&data.entries.length>0;
    const localHas=Array.isArray(state.entries)&&state.entries.length>0;
    const serverNewer=(data.updatedAt||0)>=(state.updatedAt||0);
    if(serverHas&&serverNewer){ adopt(data); }                 // servidor tem dados e é igual/mais novo
    else if(localHas){ state.updatedAt=Date.now();__dirty=true; } // tenho dados locais que devem prevalecer (restaura)
    else if(serverHas){ adopt(data); }                          // não tenho dados, servidor tem
    else { state=data;normalize(); }                            // ambos vazios
  } else { __dirty=true; } // primeira vez no servidor
  ref.onSnapshot(s=>{
    if(!s.exists)return;
    if(__dirty||__saving)return; // não sobrescreve uma edição local ainda não confirmada
    if(Date.now()-lastLocalWrite<3000)return; // janela de proteção: não reverte uma alteração recém-feita
    if(editId||$('#modalRoot').children.length)return; // não interrompe uma edição aberta
    const data=s.data();
    if(data&&data.entries&&(data.updatedAt||0)>(state.updatedAt||0)){
      state=data;normalize();applyTheme();
      if(months().indexOf(curMonth)<0)curMonth=months()[months().length-1];
      renderTabs();render();saveLocal();
    }
  },()=>{});
  flushDb(); // envia edições feitas durante o carregamento (antes do banco conectar)
}catch(e){}})();
</script>
