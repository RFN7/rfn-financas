<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Adicionar gasto — RFN</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FF3B3B'/%3E%3Ctext x='50' y='64' font-size='42' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3ERFN%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0A0B0E;--surface:#121419;--surface-2:#191C23;--border:#262B34;--ink:#F2F4F8;--muted:#8b93a1;--accent:#FF3B3B;--in:#25E39B;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#050608;color:var(--ink);font-family:system-ui,-apple-system,sans-serif;padding:20px 16px 40px}
.wrap{max-width:440px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#8a0f0f);display:grid;place-items:center;font-weight:800;color:#fff;font-size:12px}
h1{font-size:18px;margin:0}.top small{display:block;color:var(--muted);font-size:11px}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:9px;border-radius:9px}
.seg button.on{background:var(--accent);color:#fff}
.lbl{font-size:12px;color:var(--muted);margin:14px 0 8px;font-weight:600}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 12px;font-size:13.5px;font-weight:600;color:var(--ink)}
.cat .e{font-size:19px}
.cat.on{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:var(--accent)}
.val{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;color:var(--ink);font-size:26px;font-weight:800;font-family:ui-monospace,monospace;text-align:center;margin-top:4px}
.val::placeholder{color:#3a4150}
.desc{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--ink);font-size:14px;margin-top:10px}
.save{width:100%;border:0;border-radius:14px;padding:16px;font-weight:800;font-size:16px;background:var(--accent);color:#fff;margin-top:16px}
.save:disabled{opacity:.45}
#msg{text-align:center;font-size:14px;margin-top:14px;min-height:20px;font-weight:600}
.ok{color:var(--in)}.err{color:var(--accent)}
</style></head><body>
<div class="wrap">
  <div class="top"><div class="logo">RFN</div><div><h1>Adicionar gasto</h1><small>rápido — 2 toques</small></div></div>

  <div class="seg" id="seg">
    <button data-c="casa" class="on">🏠 Casa</button>
    <button data-c="pessoal">👤 Pessoal</button>
  </div>

  <div class="lbl">Categoria</div>
  <div class="cats" id="cats"></div>

  <div class="lbl">Valor</div>
  <input class="val" id="val" inputmode="decimal" placeholder="R$ 0,00">

  <input class="desc" id="desc" placeholder="Descrição (opcional)">

  <button class="save" id="save">Salvar gasto</button>
  <div id="msg"></div>
</div>

<script>
const FN="https://lckyrmhlrvuprkbqapez.supabase.co/functions/v1/quickadd";
const KEY="rfn-tap-a7Fk29Lm";
const CATS=[["🛒","Mercado"],["🍔","Alimentação"],["🚗","Transporte"],["💊","Farmácia"],["🎬","Lazer"],["🏠","Contas de casa"],["🛍️","Compras"],["📱","Assinaturas"],["💳","Cartão de crédito"],["➕","Outros"]];
let cofre="casa", cat="Mercado";
const $=s=>document.querySelector(s);
const catsEl=$("#cats");
CATS.forEach(function(c,i){
  const b=document.createElement("button");
  b.className="cat"+(i===0?" on":"");b.innerHTML='<span class="e">'+c[0]+'</span>'+c[1];
  b.onclick=function(){cat=c[1];document.querySelectorAll(".cat").forEach(x=>x.classList.remove("on"));b.classList.add("on");};
  catsEl.appendChild(b);
});
document.querySelectorAll("#seg button").forEach(function(b){
  b.onclick=function(){cofre=b.dataset.c;document.querySelectorAll("#seg button").forEach(x=>x.classList.remove("on"));b.classList.add("on");};
});
$("#save").onclick=async function(){
  const raw=$("#val").value.trim();
  if(!raw){$("#msg").className="err";$("#msg").textContent="Digite o valor 🙂";return;}
  const btn=$("#save");btn.disabled=true;$("#msg").className="";$("#msg").textContent="Salvando…";
  try{
    const r=await fetch(FN,{method:"POST",headers:{"Content-Type":"application/json","x-rfn-key":KEY},
      body:JSON.stringify({cofre:cofre,cat:cat,amount:raw,desc:$("#desc").value.trim()||cat})});
    const d=await r.json();
    if(d.ok){
      $("#msg").className="ok";$("#msg").textContent="✅ Gasto de R$ "+Number(d.entry.amount).toFixed(2).replace(".",",")+" em "+cat+" adicionado!";
      $("#val").value="";$("#desc").value="";
      if(navigator.vibrate)navigator.vibrate(40);
    }else{$("#msg").className="err";$("#msg").textContent="Erro: "+(d.error||"tente de novo");}
  }catch(e){$("#msg").className="err";$("#msg").textContent="Sem conexão. Tente de novo.";}
  btn.disabled=false;
};
</script>
</body></html>
